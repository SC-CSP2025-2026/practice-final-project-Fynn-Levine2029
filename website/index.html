  <body>
    <div class="container-hdr">
      <div class="row">
        <div class="wrapper-site-hdr">
          <header class="site-hdr site-hdr-mobile-enabled" id="id-site-hdr">
            <h2 class="hdr-devaughn-dictionary">The Devaughn Dictionary</h2>
            <search class="form-search-word-container">
              <form
                method="post"
                class="form-search-word"
                id="form-search-word"
                name="form-search-word"
              >
                <div class="search-container">
                  <div class="search-input-container">
                    <!-- <button
                      aria-label="Dismiss search"
                      id="dismiss-search-button"

                        alt=""
                        width="20"
                        id="mobile-search-back-button"
                        height="20"
                      />
                    </button> -->
                    <input
                      autocapitalize="off"
                      id="input-search-word"
                      class="input-search-word"
                      name="inputSearchWord"
                      placeholder="Search For A Word"
                      type="search"
                      autocomplete="off"
                    />
                    <button class="btn-search-word">Search</button>
                  </div>
                </div>
              </form>
            </search>
          </header>
        </div>
      </div>
    </div>
    <div class="container-words">
      <div class="word-data">
        <div class="searched-word">
          <h4>Loading...</h4>
        </div>
        <ul class="word-card"></ul>
      </div>
    </div>
